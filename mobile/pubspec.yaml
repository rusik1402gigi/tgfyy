name: spotigram
description: "Spotify-like streaming client powered directly by Telegram channel"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.9.46
  audio_service: ^0.18.18
  audio_session: ^0.1.25
  http: ^1.2.2
  cached_network_image: ^3.4.1
  provider: ^6.1.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
